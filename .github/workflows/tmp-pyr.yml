name: tmp pyramid fetch
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: curl -sSL -o data-raw/immig/es_pjan_fx.json "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?geo=FX&unit=NR&sex=M&sex=F&format=JSON" || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data-raw/immig src/data && git commit -m "tmp: test build-pyramid" && git push
