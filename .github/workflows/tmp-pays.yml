name: tmp pays fetch
on:
  push:
    branches: [pays-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run etat-pays
      - run: npm run yields
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/etat src/data/yields.json data-raw/oat10y_monthly.json src/data/taux.js && git commit -m "tmp: données pays et taux à 10 ans" && git push
